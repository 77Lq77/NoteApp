services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/enrollments_encrypted.sql:/docker-entrypoint-initdb.d/02-encrypted.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      JWT_SECRET: s3cr3t
      SECRET_KEY: dev-session-key
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
