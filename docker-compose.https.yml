services:
  web:
    # Compose merges port lists, so explicitly remove the plain HTTP mapping.
    ports: !reset []
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
